openapi: 3.1.0

info:
  title: ATARA-Pay API
  description: |
    **ATARA-Pay** is the protocol-aggregation gateway of the Atara stack.
    One HTTP API, multiple payment rails (CrossMint, Tempo, soon Lightning
    + OTC). AI agents and B2B integrators issue wallets, move money, and
    accept fiat without learning any one provider's SDK.

    ## Authentication

    Every `/v1/*` endpoint accepts EITHER an API key OR a session JWT in
    the `Authorization: Bearer <token>` header.

    - **API keys** are minted at signup and via `POST /v1/api-keys`.
      Prefixed `sk_test_…` or `sk_live_…`. Show 40 chars total. Server
      stores only the SHA-256 hash; the raw key is shown ONCE at creation.
    - **Session JWTs** come from `POST /login`. Used by the dashboard.

    Public endpoints (no auth required): `POST /signup`, `POST /login`,
    `GET /health`, `GET /v1/rails`.

    ## Idempotency

    Money-moving endpoints (`/transactions`, `/onramp`) honor an
    `idempotency_key` body field. Repeated calls with the same
    `(tenant, idempotency_key)` return the prior result instead of
    re-charging.

    ## Webhooks

    Customers register endpoints via `/v1/webhook-endpoints` and receive
    HMAC-SHA256-signed POSTs for each subscribed event type. See the
    webhook delivery section for the full event catalog.
  version: "1.0.0"
  contact:
    name: Atara
    url: https://atara.xyz
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.staging.atara.xyz
    description: Staging
  - url: https://api.atara.xyz
    description: Production

tags:
  - name: System
    description: Health checks + rail catalog + Prometheus metrics
  - name: Auth
    description: Sign up, log in, manage API keys
  - name: Wallets
    description: Dual-rail wallet groups + their constituent wallets
  - name: Transactions
    description: Cross-rail transfers + smart routing
  - name: Onramp
    description: Fiat → stablecoin orders
  - name: Session Keys
    description: AI Agent delegated signers with chain-enforced limits
  - name: Limits
    description: Tenant-level spending policy + violation audit log
  - name: Webhooks
    description: Outbound event delivery endpoints
  - name: Virtual Addresses
    description: Per-customer / per-invoice deposit addresses (TIP-1022)
  - name: Accounting
    description: Aggregated balances and monthly statements

# ──────────────────────────────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────────────────────────────

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Either an Atara API key (`sk_test_…` / `sk_live_…`) or a dashboard
        session JWT. The server inspects the prefix and routes accordingly.

  # ──────────────────────────────────────────────────────────────────────
  # Reusable parameters
  # ──────────────────────────────────────────────────────────────────────
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Maximum rows to return. Capped at 200; defaults to 50.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    OffsetParam:
      name: offset
      in: query
      description: Rows to skip. Defaults to 0.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  # ──────────────────────────────────────────────────────────────────────
  # Reusable error shape
  # ──────────────────────────────────────────────────────────────────────
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "invalid email or password"

    # ────────────────────────────────────────────────────────────────────
    # Auth + signup
    # ────────────────────────────────────────────────────────────────────
    SignupRequest:
      type: object
      required: [company_name, email, password]
      properties:
        company_name:
          type: string
          maxLength: 100
          example: "AI-Tutor Inc"
        email:
          type: string
          format: email
          example: "cto@ai-tutor.com"
        password:
          type: string
          minLength: 12
          format: password
          example: "correct horse battery staple"

    SignupResponse:
      type: object
      required: [tenant, user, api_keys]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        user:
          $ref: '#/components/schemas/User'
        api_keys:
          type: object
          required: [test, live]
          properties:
            test:
              $ref: '#/components/schemas/MintedAPIKey'
            live:
              $ref: '#/components/schemas/MintedAPIKey'
        _notice:
          type: string
          description: |
            Reminder to persist the raw `key` values immediately.
            They cannot be retrieved later.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [session_token, expires_at, user, tenant_id]
      properties:
        session_token:
          type: string
          description: HS256-signed JWT. Pass as `Authorization Bearer`.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp at which the token expires.
        user:
          $ref: '#/components/schemas/User'
        tenant_id:
          type: string

    Tenant:
      type: object
      properties:
        id: { type: string, example: "tn_01J9K…" }
        name: { type: string }
        primary_email: { type: string }
        plan:
          type: string
          enum: [free, starter, growth, enterprise, custom]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [owner, admin, developer, finance, viewer]

    MintedAPIKey:
      type: object
      description: |
        The shape returned at creation only. List/get responses omit `key`
        and show only `prefix`.
      properties:
        id: { type: string, example: "ak_01J9K…" }
        key:
          type: string
          description: Raw secret — ONE-TIME.
          example: "sk_test_aB3dE7fGhJ2kL4mN5pQ8rS9tU0vW1xY2-_zA"
        prefix:
          type: string
          example: "sk_test_aB3dE7fGhJ2k"

    # ────────────────────────────────────────────────────────────────────
    # API key management (post-signup)
    # ────────────────────────────────────────────────────────────────────
    APIKey:
      type: object
      description: |
        Safe-to-return projection. Never contains the raw secret — only
        the prefix the user can use to recognize it in the dashboard.
      required: [id, name, environment, prefix]
      properties:
        id: { type: string, example: "ak_01J9K…" }
        name: { type: string, example: "production-backend" }
        environment:
          type: string
          enum: [test, live]
        prefix:
          type: string
          example: "sk_test_aB3dE7fGhJ2k"
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    CreateAPIKeyRequest:
      type: object
      required: [name, environment]
      properties:
        name:
          type: string
          example: "production-backend"
        environment:
          type: string
          enum: [test, live]

    CreateAPIKeyResponse:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Raw secret — ONE-TIME.
            _notice:
              type: string

    RevokeAPIKeyRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional audit-trail note; defaults to "manually revoked".

    ListAPIKeysResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/APIKey' }

    # ────────────────────────────────────────────────────────────────────
    # Tenant-level limits (policies + violations)
    # ────────────────────────────────────────────────────────────────────
    Tier:
      type: string
      enum: [conservative, standard, aggressive, custom]
      description: |
        Preset spending tiers. New tenants land at `conservative`
        (per-tx $5 / daily $20 / weekly $100 / monthly $300). Switch via
        PUT /v1/tenants/me/limits.

    Policy:
      type: object
      description: |
        A limit_policies row, safe-to-return projection.
      required: [id, scope_type, period_asset, timezone, enabled]
      properties:
        id: { type: string, example: "pol_01J9K…" }
        scope_type:
          type: string
          enum: [tenant_default, wallet_group, wallet, session_key]
        tier: { $ref: '#/components/schemas/Tier' }
        per_tx_amount:
          type: string
          description: Decimal USD; empty when unset.
          example: "5"
        daily_amount:   { type: string, example: "20" }
        weekly_amount:  { type: string, example: "100" }
        monthly_amount: { type: string, example: "300" }
        period_asset:   { type: string, example: "USDC" }
        timezone:       { type: string, example: "UTC" }
        enabled:        { type: boolean }
        created_at:     { type: string, format: date-time }

    UpdateTenantLimitsRequest:
      type: object
      description: |
        Specify EITHER `tier` OR all four explicit caps — never both. The
        server rejects partial cap updates so column state stays
        consistent.
      oneOf:
        - type: object
          required: [tier]
          properties:
            tier:
              type: string
              enum: [conservative, standard, aggressive]
        - type: object
          required: [per_tx_amount, daily_amount, weekly_amount, monthly_amount]
          properties:
            per_tx_amount:   { type: string, example: "100" }
            daily_amount:    { type: string, example: "500" }
            weekly_amount:   { type: string, example: "3000" }
            monthly_amount:  { type: string, example: "8000" }

    Violation:
      type: object
      required: [id, type]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - per_tx_exceeded
            - daily_exceeded
            - weekly_exceeded
            - monthly_exceeded
            - recipient_denied
            - recipient_not_allowlisted
            - policy_expired
            - session_key_expired
        policy_id:           { type: string }
        wallet_id:           { type: string }
        session_key_id:      { type: string }
        transaction_id:      { type: string }
        attempted_amount:    { type: string }
        attempted_asset:     { type: string }
        attempted_recipient: { type: string }
        created_at:          { type: string, format: date-time }

    ListViolationsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Violation' }

    # ────────────────────────────────────────────────────────────────────
    # Wallet groups (dual-rail by default)
    # ────────────────────────────────────────────────────────────────────
    Rail:
      type: string
      enum: [crossmint, tempo, loka-ln]
      description: |
        Underlying payment provider for a wallet. Each wallet group has
        one wallet per rail (CrossMint + Tempo today; Lightning planned).

    Custody:
      type: string
      enum: [platform, user, mpc]
      description: |
        Who holds the private key.
        - `platform`: Atara holds it (default; encrypted in DB or by the
          provider — see rail-specific docs).
        - `user`: client supplies their own address; Atara never sees the
          key.
        - `mpc`: multi-party computation, neither side has the full key
          (planned).

    OwnerType:
      type: string
      enum: [user, agent, merchant, treasury]

    Owner:
      type: object
      required: [type, ref]
      properties:
        type: { $ref: '#/components/schemas/OwnerType' }
        ref:
          type: string
          maxLength: 200
          example: "user_alice_123"
          description: |
            The customer's external identifier. Atara never assigns
            meaning to it — repeated requests with the same `ref` are
            idempotent (you'll get the same group back).

    Wallet:
      type: object
      description: |
        One on-chain account on one rail. Wallets belong to exactly one
        wallet_group. encrypted_private_key NEVER appears in API
        responses.
      required: [id, rail, chain, address, custody, status]
      properties:
        id: { type: string, example: "wlt_01J9K…" }
        rail:    { $ref: '#/components/schemas/Rail' }
        chain:   { type: string, example: "base" }
        address: { type: string, example: "0xA1B2…" }
        custody: { $ref: '#/components/schemas/Custody' }
        provider_locator:
          type: string
          description: Rail-side identifier (CrossMint `cm_xxx`; Tempo = address).
        status:
          type: string
          enum: [active, frozen, deleted]

    WalletGroup:
      type: object
      required: [id, tenant_id, owner_type, owner_ref, custody, wallets]
      properties:
        id: { type: string, example: "wg_01J9K…" }
        tenant_id: { type: string }
        owner_type: { $ref: '#/components/schemas/OwnerType' }
        owner_ref:  { type: string }
        parent_group_id:
          type: string
          description: Only set when owner_type=agent; points at the
                       user group that owns the agent.
        custody: { $ref: '#/components/schemas/Custody' }
        display_name: { type: string }
        wallets:
          type: array
          items: { $ref: '#/components/schemas/Wallet' }
          minItems: 0
        created_at: { type: string, format: date-time }
        _reused:
          type: boolean
          description: |
            true when this group already existed (idempotency match by
            owner_ref) and no new wallets were minted.

    CreateGroupRequest:
      type: object
      required: [owner]
      properties:
        owner: { $ref: '#/components/schemas/Owner' }
        parent_group_id:
          type: string
          description: Required when owner.type=agent.
        display_name: { type: string }
        crossmint_chain:
          type: string
          description: Optional CrossMint chain override. Defaults to "base".
          default: base
          example: base

    ListGroupsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WalletGroup' }

    # ────────────────────────────────────────────────────────────────────
    # Transactions
    # ────────────────────────────────────────────────────────────────────
    Asset:
      type: string
      description: |
        Token symbol in uppercase. `USDC` and `USDT` route to CrossMint by
        default; `pathUSD` routes to Tempo. Override via `rail` on the
        request.
      example: USDC

    SendTransactionRequest:
      type: object
      required: [to, amount, asset]
      properties:
        to:
          type: string
          description: |
            Destination — either an on-chain address (0x…) or a merchant
            identifier (`merchant:openai`) the platform resolves
            internally.
          example: "0xC3D4…"
        amount:
          type: string
          example: "10"
        asset: { $ref: '#/components/schemas/Asset' }
        rail:
          type: string
          enum: [crossmint, tempo]
          description: |
            Override the default asset → rail mapping. Required when the
            asset has no default (rare).
        signer_id:
          type: string
          description: |
            ID of an active session key on the wallet. When set, policy
            resolution prefers that session key's scope; the audit row's
            `session_key_id` is populated for traceability.
        idempotency_key:
          type: string
          description: |
            Customer-supplied key making the request safely retryable.
            Re-using a `(tenant, idempotency_key)` returns the prior
            transaction instead of re-charging.

    TxStatus:
      type: string
      enum: [pending, broadcast, succeeded, failed, cancelled]

    Transaction:
      type: object
      required: [id, rail, chain, status, from, to, amount, asset]
      properties:
        id:     { type: string, example: "tx_01J9K…" }
        rail:   { $ref: '#/components/schemas/Rail' }
        chain:  { type: string }
        status: { $ref: '#/components/schemas/TxStatus' }
        from:   { type: string, description: "Wallet id" }
        to:     { type: string }
        amount: { type: string }
        asset:  { $ref: '#/components/schemas/Asset' }
        tx_hash: { type: string }
        provider_tx_id: { type: string }
        created_at: { type: string, format: date-time }

    TransactionLimitError:
      type: object
      description: |
        Returned with HTTP 429 when limits.Service denies the transfer.
        The body carries the structured violation so customers can react
        precisely (alert, swap signer, escalate tier).
      required: [error, violation, policy_id]
      properties:
        error:     { type: string, example: "spending limit exceeded" }
        policy_id: { type: string }
        violation:
          type: object
          properties:
            type:         { type: string, example: "daily_exceeded" }
            limit_value:  { type: string, example: "20" }
            current_used: { type: string, example: "23.5" }
            message:      { type: string }

    # ────────────────────────────────────────────────────────────────────
    # Onramp
    # ────────────────────────────────────────────────────────────────────
    FiatAmount:
      type: object
      required: [amount, currency]
      properties:
        amount:   { type: string, example: "100" }
        currency:
          type: string
          description: ISO 4217.
          example: USD

    CreateOnrampRequest:
      type: object
      required: [fiat, asset]
      properties:
        fiat:  { $ref: '#/components/schemas/FiatAmount' }
        asset: { $ref: '#/components/schemas/Asset' }
        chain: { type: string, example: "base" }
        idempotency_key: { type: string }

    OnrampStatus:
      type: string
      enum: [pending, checkout_opened, paid, delivering, completed, failed, expired]

    OnrampOrder:
      type: object
      required: [id, status, provider, wallet_id, fiat_amount, fiat_currency, asset, chain]
      properties:
        id:        { type: string, example: "ord_01J9K…" }
        status:    { $ref: '#/components/schemas/OnrampStatus' }
        provider:  { type: string, example: "crossmint" }
        wallet_id: { type: string }
        fiat_amount:   { type: string }
        fiat_currency: { type: string }
        asset:    { $ref: '#/components/schemas/Asset' }
        chain:    { type: string }
        checkout_url:
          type: string
          format: uri
          description: |
            Hosted checkout URL the client opens (iframe / new window) for
            the end-user to enter their card details. Expires after ~30m.
        provider_order_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    # ────────────────────────────────────────────────────────────────────
    # Session keys (delegated signers for AI agents)
    # ────────────────────────────────────────────────────────────────────
    RotationMode:
      type: string
      enum: [auto_rotate, notify_only, hard_expire]
      description: |
        How Atara handles the rotation cursor.
        - `auto_rotate`: server mints a replacement key + ships it via
          webhook (`session_key.rotated`) at the configured interval.
        - `notify_only`: emit `session_key.expiring_soon` 24h ahead; the
          customer schedules their own replacement call.
        - `hard_expire`: nothing happens, the key just stops working at
          `expires_at`.

    SessionKeyLimits:
      type: object
      required: [per_tx_amount, daily_amount, weekly_amount, monthly_amount]
      properties:
        per_tx_amount:  { type: string, example: "1" }
        daily_amount:   { type: string, example: "5" }
        weekly_amount:  { type: string, example: "30" }
        monthly_amount: { type: string, example: "100" }
        allowed_recipients:
          type: array
          items: { type: string }
          example: ["merchant:openai", "merchant:prakasa"]
        denied_recipients:
          type: array
          items: { type: string }

    CreateSessionKeyRequest:
      type: object
      required: [name, limits]
      properties:
        name:
          type: string
          maxLength: 100
          example: "alice-ai-tutor"
        rail:
          type: string
          enum: [tempo, crossmint]
          default: tempo
          description: |
            Wallet anchor for the session key. Defaults to Tempo (the
            AI-agent use case is the primary one).
        limits: { $ref: '#/components/schemas/SessionKeyLimits' }
        rotation_mode: { $ref: '#/components/schemas/RotationMode' }
        rotation_interval_hours:
          type: integer
          minimum: 0
          maximum: 720
          default: 24
        expires_at:
          type: string
          format: date-time
          description: RFC 3339. Defaults to now + 24h.
        on_chain_enforce:
          type: boolean
          default: false
          description: |
            When true (requires rail=tempo), Atara broadcasts an
            `authorizeKey` call to the Tempo AccountKeychain precompile.
            The daily cap becomes CHAIN-ENFORCED in addition to
            gateway-enforced — an attacker who steals the session key's
            private bytes can still spend no more than the daily cap per
            24h because the precompile reverts past it.

    SessionKey:
      type: object
      required: [id, name, wallet_id, group_id, public_address, status, rotation_mode, rail_native]
      properties:
        id:              { type: string, example: "sk_01J9K…" }
        name:            { type: string }
        wallet_id:       { type: string }
        group_id:        { type: string }
        public_address:  { type: string, example: "0xAGENT…" }
        policy_id:       { type: string }
        status:
          type: string
          enum: [active, rotating, expired, revoked]
        rotation_mode:       { $ref: '#/components/schemas/RotationMode' }
        rotation_interval_s: { type: integer }
        expires_at:          { type: string, format: date-time }
        next_rotation_at:   { type: string, format: date-time }
        rail_native:
          type: boolean
          description: |
            true iff the Tempo precompile attests this key. The
            `authorizeKey()` tx is in `on_chain_tx_hash` of the
            full server-side row.
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    CreateSessionKeyResponse:
      allOf:
        - $ref: '#/components/schemas/SessionKey'
        - type: object
          required: [private_key]
          properties:
            private_key:
              type: string
              description: |
                Lowercase-hex 64 chars (32 bytes) — the secp256k1 raw
                private key. Returned ONLY here. Atara never stores it
                in plaintext after this call.
            _notice: { type: string }

    RevokeSessionKeyRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional audit-trail note. Defaults to "manually revoked".

    ListSessionKeysResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SessionKey' }

    # ────────────────────────────────────────────────────────────────────
    # Webhooks
    # ────────────────────────────────────────────────────────────────────
    WebhookEventType:
      type: string
      description: |
        Canonical event names. Subscribers list these in
        `subscribed_events`; empty array means "all events".
      enum:
        - onramp.created
        - onramp.completed
        - onramp.failed
        - transaction.succeeded
        - transaction.failed
        - session_key.created
        - session_key.expired
        - session_key.revoked
        - session_key.rotated
        - limit.exceeded
        - wallet_group.created

    EndpointStatus:
      type: string
      enum: [active, paused, deleted]

    WebhookEndpoint:
      type: object
      description: |
        Safe-to-return projection. The HMAC secret is omitted — only its
        version is exposed so customers can audit "yes I have v3 too"
        without re-leaking the secret bytes.
      required: [id, url, subscribed_events, status, secret_version]
      properties:
        id:  { type: string, example: "we_01J9K…" }
        url: { type: string, format: uri, example: "https://customer.com/atara" }
        subscribed_events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          description: Empty array = subscribe to ALL events.
        status:         { $ref: '#/components/schemas/EndpointStatus' }
        description:    { type: string }
        secret_version: { type: integer, example: 1 }
        consecutive_failures: { type: integer }
        last_success_at: { type: string, format: date-time }
        last_failure_at: { type: string, format: date-time }
        created_at:      { type: string, format: date-time }

    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                Base64-encoded 32-byte HMAC secret. Returned ONLY at
                creation and rotation. Customers verify outgoing
                webhooks via
                  HMAC-SHA256(decode(secret), raw_body)
                compared against the `X-Atara-Signature` header.
            _notice: { type: string }

    CreateEndpointRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: |
            HTTPS required. http allowed only for localhost (development).
        subscribed_events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }

    UpdateEndpointRequest:
      type: object
      description: |
        PATCH semantics: omitted fields = no change. Pointer-style nulls
        in code map to JSON `null`/missing here.
      properties:
        url:
          type: string
          format: uri
        subscribed_events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status:
          type: string
          enum: [active, paused]
          description: |
            Customers can pause/resume; `deleted` is reserved for the
            DELETE endpoint.

    ListEndpointsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookEndpoint' }

    # ────────────────────────────────────────────────────────────────────
    # Virtual addresses (TIP-1022)
    # ────────────────────────────────────────────────────────────────────
    VirtualAddress:
      type: object
      description: |
        Deterministic per-(wallet, label) deposit address. Funds sent to
        `address` route to the parent Tempo wallet automatically via the
        AddressRegistry precompile.
      required: [id, wallet_id, group_id, label, address]
      properties:
        id:        { type: string, example: "vaddr_01J9K…" }
        wallet_id: { type: string }
        group_id:  { type: string }
        label:
          type: string
          maxLength: 200
          description: |
            Free-form customer shard. Same label → same address every
            time (keccak256 mapped on chain).
        address:
          type: string
          example: "0xVA00…"
        registration_tx_hash:
          type: string
          description: Tempo tx hash that registered this label on chain.
        created_at: { type: string, format: date-time }

    CreateVirtualAddressRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 200
          example: "invoice-42"

    ListVirtualAddressesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VirtualAddress' }

    # ────────────────────────────────────────────────────────────────────
    # Accounting (M9)
    # ────────────────────────────────────────────────────────────────────
    AssetBalanceLine:
      type: object
      description: |
        One (asset, direction) row from a SUM aggregate over the
        transactions table. Amount is a decimal string preserving full
        NUMERIC(38,18) precision.
      required: [asset, direction, tx_count, total_amount]
      properties:
        asset:        { type: string, example: "USDC" }
        direction:
          type: string
          enum: [outbound, inbound, internal]
        tx_count:     { type: integer, format: int64 }
        total_amount: { type: string, example: "1234.56" }

    GroupBalanceResponse:
      type: object
      required: [group_id, lines]
      properties:
        group_id: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/AssetBalanceLine' }

    OnrampLine:
      type: object
      required: [fiat_currency, asset, order_count]
      properties:
        fiat_currency:    { type: string, example: "USD" }
        asset:            { type: string, example: "USDC" }
        order_count:      { type: integer, format: int64 }
        fiat_total:       { type: string, example: "500" }
        crypto_delivered: { type: string, example: "485.50" }

    MonthlyStatement:
      type: object
      description: |
        Aggregated per-(asset, direction) totals over a UTC half-open
        month window plus the fiat onramp completions in the same window.
      required: [month, window_start, window_end, transactions, onramp]
      properties:
        month:        { type: string, example: "2026-05" }
        window_start: { type: string, format: date-time }
        window_end:
          type: string
          format: date-time
          description: Exclusive (matches SQL `created_at < window_end`).
        transactions:
          type: array
          items: { $ref: '#/components/schemas/AssetBalanceLine' }
        onramp:
          type: array
          items: { $ref: '#/components/schemas/OnrampLine' }

# ──────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check + registered rails
      security: []          # public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  rails:
                    type: array
                    items: { type: string }
                    example: [crossmint, tempo]

  /v1/rails:
    get:
      tags: [System]
      operationId: listRails
      summary: List registered payment rails
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rails:
                    type: array
                    items: { type: string }

  /signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Create a tenant, owner user, and default test+live keys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email + password for a session JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ──────────────────────────────────────────────────────────────────────
  # API key management
  # ──────────────────────────────────────────────────────────────────────

  /v1/api-keys:
    get:
      tags: [Auth]
      operationId: listAPIKeys
      summary: List the tenant's API keys (active + revoked)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListAPIKeysResponse' }
    post:
      tags: [Auth]
      operationId: createAPIKey
      summary: Mint a new API key
      description: |
        Returns the raw `key` string ONCE. Store it immediately — only the
        prefix is recoverable later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAPIKeyResponse' }
        '400':
          description: Invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot manage keys (owner/admin required)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/api-keys/{id}:
    delete:
      tags: [Auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: |
        Idempotent. Repeating the call on an already-revoked key returns
        the same row unchanged, preserving the original revoked_at
        timestamp.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeAPIKeyRequest' }
      responses:
        '200':
          description: Revoked (or already revoked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        '403':
          description: Role cannot revoke keys
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Key not found in this tenant
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Tenant-level spending limits
  # ──────────────────────────────────────────────────────────────────────

  /v1/tenants/me/limits:
    get:
      tags: [Limits]
      operationId: getTenantLimits
      summary: Get the current tenant_default policy
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Policy' } }
        '404':
          description: No tenant_default policy has been set
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    put:
      tags: [Limits]
      operationId: updateTenantLimits
      summary: Switch tier or set explicit caps
      description: |
        Supply EITHER `tier` (preset) OR all four explicit cap fields.
        Partial cap updates are rejected — the four columns move
        together. The server disables the prior active policy and
        inserts a fresh row, so `limit_violations.policy_id` keeps
        referencing the policy each violation actually breached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantLimitsRequest' }
      responses:
        '200':
          description: New tenant_default policy
          content:
            application/json: { schema: { $ref: '#/components/schemas/Policy' } }
        '400':
          description: Body shape invalid (e.g. both tier and caps supplied)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot change tenant limits
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/tenants/me/limits/violations:
    get:
      tags: [Limits]
      operationId: listLimitViolations
      summary: Paginated audit log of rejected transfers
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListViolationsResponse' }

  # ──────────────────────────────────────────────────────────────────────
  # Wallet groups
  # ──────────────────────────────────────────────────────────────────────

  /v1/wallet-groups:
    post:
      tags: [Wallets]
      operationId: createWalletGroup
      summary: Provision a dual-rail wallet group (CrossMint + Tempo)
      description: |
        Atomically creates one wallet_group plus one wallet per configured
        rail. CrossMint and Tempo are both created today; the Tempo
        wallet's master key is AES-256-GCM-encrypted at rest.

        **Idempotent.** Repeating the call with the same
        `(tenant, owner.ref)` returns the existing group untouched with
        `_reused: true`. Up to one CrossMint orphan can occur if two
        clients race past the idempotency lookup — a sweeper reconciles
        from externalUserId.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '200':
          description: Existing group returned (idempotent re-call).
          content:
            application/json: { schema: { $ref: '#/components/schemas/WalletGroup' } }
        '201':
          description: Created
          content:
            application/json: { schema: { $ref: '#/components/schemas/WalletGroup' } }
        '400':
          description: Invalid input (bad owner.type, missing ref, agent without parent_group_id…)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '502':
          description: Upstream rail (CrossMint) returned an error
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    get:
      tags: [Wallets]
      operationId: listWalletGroups
      summary: Paginated list of the tenant's wallet groups
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/ListGroupsResponse' } }

  /v1/wallet-groups/{id}:
    get:
      tags: [Wallets]
      operationId: getWalletGroup
      summary: Fetch a wallet group + its wallets
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/WalletGroup' } }
        '404':
          description: Not found (or belongs to another tenant)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/wallet-groups/{id}/transactions:
    post:
      tags: [Transactions]
      operationId: sendTransaction
      summary: Smart-routed transfer
      description: |
        Picks the rail by asset (`USDC` / `USDT` → CrossMint;
        `pathUSD` → Tempo) unless `rail` overrides. Runs the limit gate
        BEFORE the rail call — a denied attempt costs zero gas. When
        `signer_id` is supplied, policy resolution prefers the
        session-key-scoped policy (typically tighter caps).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendTransactionRequest' }
      responses:
        '201':
          description: Transaction broadcast (status may be pending/broadcast/succeeded)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Transaction' } }
        '400':
          description: Invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: signer_id rejected (wrong tenant, wrong wallet, revoked, expired)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '422':
          description: Group has no active wallet on the routed rail
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '429':
          description: Spending limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionLimitError' }
        '502':
          description: Upstream rail error
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/wallet-groups/{id}/onramp:
    post:
      tags: [Onramp]
      operationId: createOnrampOrder
      summary: Start a fiat → stablecoin order
      description: |
        Always routes through CrossMint — Tempo has no fiat rail today.
        Returns a hosted checkout URL the client embeds in an iframe.
        Order auto-expires ~30 minutes after creation if not paid.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOnrampRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json: { schema: { $ref: '#/components/schemas/OnrampOrder' } }
        '400':
          description: Invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '422':
          description: Group has no active CrossMint wallet (onramp unavailable)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '502':
          description: Upstream rail error
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Session keys (per-wallet AI-agent delegated signers)
  # ──────────────────────────────────────────────────────────────────────

  /v1/wallet-groups/{id}/session-keys:
    post:
      tags: [Session Keys]
      operationId: createSessionKey
      summary: Mint a session key for one of the group's wallets
      description: |
        Generates a secp256k1 keypair, encrypts the private bytes
        (AES-256-GCM via the keystore master key), inserts both a
        dedicated `limit_policy` and the `session_keys` row in ONE
        transaction. When `on_chain_enforce` is true (Tempo only), an
        `authorizeKey()` is broadcast first and its tx hash is stamped
        on the row.

        The raw `private_key` field is returned ONCE. Store it into the
        AI agent's runtime immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionKeyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionKeyResponse' }
        '400':
          description: Invalid input (bad rotation_mode, on_chain_enforce without rail=tempo, etc.)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot create session keys (owner/admin required)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '422':
          description: Group has no active wallet on the requested rail
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    get:
      tags: [Session Keys]
      operationId: listSessionKeys
      summary: List session keys for every wallet in the group
      description: |
        Includes revoked / expired so dashboards can audit history.
        Sort: most-recent first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSessionKeysResponse' }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/wallet-groups/{id}/session-keys/{sk_id}:
    delete:
      tags: [Session Keys]
      operationId: revokeSessionKey
      summary: Revoke a session key
      description: |
        Idempotent. Already-revoked / expired keys are returned
        unchanged; the original revoked_at is preserved on re-delete.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sk_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeSessionKeyRequest' }
      responses:
        '200':
          description: Revoked (or already inactive)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionKey' }
        '403':
          description: Role cannot revoke session keys
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Session key not found in this tenant
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Webhook endpoints
  # ──────────────────────────────────────────────────────────────────────

  /v1/webhook-endpoints:
    post:
      tags: [Webhooks]
      operationId: createWebhookEndpoint
      summary: Register a webhook receiver
      description: |
        Mints a 32-byte HMAC secret bound to this endpoint. The raw
        secret is returned ONCE (base64-encoded). Use it to verify every
        outbound delivery via
          HMAC-SHA256(decode(secret), raw_body) == X-Atara-Signature

        Each delivery also carries:
          X-Atara-Event-Id          unique webhook_event id
          X-Atara-Event-Type        e.g. "transaction.succeeded"
          X-Atara-Signature-Version which secret revision signed it

        Use the event id as the idempotency key on your side — Atara
        retries with exponential backoff (30s → 2m → 10m → 1h → 6h →
        24h, cap) for up to 8 attempts before marking the event dead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEndpointRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' }
        '400':
          description: Invalid URL (must be https or http://localhost) or event names
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot manage webhook endpoints
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    get:
      tags: [Webhooks]
      operationId: listWebhookEndpoints
      summary: List the tenant's webhook receivers
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListEndpointsResponse' }

  /v1/webhook-endpoints/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookEndpoint
      summary: Fetch one receiver
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '404':
          description: Not found in this tenant
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    patch:
      tags: [Webhooks]
      operationId: updateWebhookEndpoint
      summary: Partially update a receiver
      description: |
        Body fields are optional; omitted = no change. status accepts
        only `active` or `paused` — `deleted` is reserved for the
        DELETE route.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEndpointRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400':
          description: Invalid url / event names / status
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot modify webhook endpoints
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    delete:
      tags: [Webhooks]
      operationId: deleteWebhookEndpoint
      summary: Soft delete a receiver
      description: |
        Idempotent. The row stays at `status=deleted` so historical
        webhook_events still resolve their endpoint reference.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted (or already deleted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403':
          description: Role cannot delete webhook endpoints
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Mint a new HMAC secret for the endpoint
      description: |
        Bumps `secret_version` atomically. Events ALREADY queued under
        the prior version keep signing with that version (stamped on
        each `webhook_events` row) so receivers verifying via the
        version header continue to succeed during the rollover window.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: New secret minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' }
        '403':
          description: Role cannot rotate webhook secrets
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Virtual addresses (TIP-1022)
  # ──────────────────────────────────────────────────────────────────────

  /v1/wallet-groups/{id}/virtual-addresses:
    post:
      tags: [Virtual Addresses]
      operationId: createVirtualAddress
      summary: Provision a per-customer / per-invoice deposit address
      description: |
        Mints a virtual address on the group's Tempo wallet. Idempotent
        on (wallet_id, label) — repeating the call with the same label
        returns the existing row, no new on-chain registration.

        The label is hashed (keccak256) into a 32-byte slot the Tempo
        AddressRegistry precompile uses to derive the address
        deterministically. So `"invoice-42"` always maps to the same
        address for a given parent wallet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVirtualAddressRequest' }
      responses:
        '200':
          description: Already existed; returned unchanged (idempotent re-call).
          content:
            application/json: { schema: { $ref: '#/components/schemas/VirtualAddress' } }
        '201':
          description: Newly created
          content:
            application/json: { schema: { $ref: '#/components/schemas/VirtualAddress' } }
        '400':
          description: Invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '422':
          description: Group has no active Tempo wallet
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '502':
          description: Tempo RPC error during registration
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    get:
      tags: [Virtual Addresses]
      operationId: listVirtualAddresses
      summary: List virtual addresses for the group's Tempo wallet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK (empty data array if no Tempo wallet in this group)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListVirtualAddressesResponse' }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Accounting (M9)
  # ──────────────────────────────────────────────────────────────────────

  /v1/wallet-groups/{id}/balance:
    get:
      tags: [Accounting]
      operationId: getGroupBalance
      summary: Sum of succeeded transfers by (asset, direction)
      description: |
        Live aggregate over the transactions table. Cheap for typical
        group sizes; M9.2 will swap to a pre-materialized rollup once
        we see tenants with millions of transfers.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/GroupBalanceResponse' } }
        '404':
          description: Wallet group not found
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/tenants/me/statements/{month}:
    get:
      tags: [Accounting]
      operationId: getMonthlyStatement
      summary: Aggregated transactions + onramp totals for a UTC month
      description: |
        `month` is `YYYY-MM`. The handler computes a half-open
        `[start, end)` UTC window so the SQL
        `created_at >= start AND created_at < end` matches without an
        off-by-one at the month boundary.
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
            example: "2026-05"
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/MonthlyStatement' } }
        '400':
          description: month not in YYYY-MM
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Observability (M13)
  # ──────────────────────────────────────────────────────────────────────

  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus scrape endpoint
      security: []
      description: |
        Returns Prometheus text-format metrics covering HTTP traffic,
        domain events (limit violations, webhook deliveries, session-key
        lifecycle), and outbound rail call latency. Operators point
        Prometheus / Grafana / OpenTelemetry collectors here.

        Standard Go runtime + process collectors are included so heap,
        gc, fds etc. land alongside the application metrics.
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP atara_pay_http_requests_total Total HTTP requests served, partitioned by method, route, status class.
                  # TYPE atara_pay_http_requests_total counter
                  atara_pay_http_requests_total{method="POST",route="/v1/wallet-groups/:id/transactions",status_class="2xx"} 42
