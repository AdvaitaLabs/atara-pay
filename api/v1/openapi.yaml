openapi: 3.1.0

info:
  title: ATARA-Pay API
  description: |
    **ATARA-Pay** is the protocol-aggregation gateway of the Atara stack.
    One HTTP API, multiple payment rails (CrossMint, Tempo, soon Lightning
    + OTC). AI agents and B2B integrators issue wallets, move money, and
    accept fiat without learning any one provider's SDK.

    ## Authentication

    Every `/v1/*` endpoint accepts EITHER an API key OR a session JWT in
    the `Authorization: Bearer <token>` header.

    - **API keys** are minted at signup and via `POST /v1/api-keys`.
      Prefixed `sk_test_…` or `sk_live_…`. Show 40 chars total. Server
      stores only the SHA-256 hash; the raw key is shown ONCE at creation.
    - **Session JWTs** come from `POST /login`. Used by the dashboard.

    Public endpoints (no auth required): `POST /signup`, `POST /login`,
    `GET /health`, `GET /v1/rails`.

    ## Idempotency

    Money-moving endpoints (`/transactions`, `/onramp`) honor an
    `idempotency_key` body field. Repeated calls with the same
    `(tenant, idempotency_key)` return the prior result instead of
    re-charging.

    ## Webhooks

    Customers register endpoints via `/v1/webhook-endpoints` and receive
    HMAC-SHA256-signed POSTs for each subscribed event type. See the
    webhook delivery section for the full event catalog.
  version: "1.0.0"
  contact:
    name: Atara
    url: https://atara.xyz
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.staging.atara.xyz
    description: Staging
  - url: https://api.atara.xyz
    description: Production

tags:
  - name: System
    description: Health checks + rail catalog
  - name: Auth
    description: Sign up, log in, manage API keys
  - name: Wallets
    description: Dual-rail wallet groups + their constituent wallets
  - name: Transactions
    description: Cross-rail transfers + smart routing
  - name: Onramp
    description: Fiat → stablecoin orders
  - name: Session Keys
    description: AI Agent delegated signers with chain-enforced limits
  - name: Limits
    description: Tenant-level spending policy + violation audit log
  - name: Webhooks
    description: Outbound event delivery endpoints

# ──────────────────────────────────────────────────────────────────────
# Security
# ──────────────────────────────────────────────────────────────────────

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Either an Atara API key (`sk_test_…` / `sk_live_…`) or a dashboard
        session JWT. The server inspects the prefix and routes accordingly.

  # ──────────────────────────────────────────────────────────────────────
  # Reusable parameters
  # ──────────────────────────────────────────────────────────────────────
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Maximum rows to return. Capped at 200; defaults to 50.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    OffsetParam:
      name: offset
      in: query
      description: Rows to skip. Defaults to 0.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  # ──────────────────────────────────────────────────────────────────────
  # Reusable error shape
  # ──────────────────────────────────────────────────────────────────────
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "invalid email or password"

    # ────────────────────────────────────────────────────────────────────
    # Auth + signup
    # ────────────────────────────────────────────────────────────────────
    SignupRequest:
      type: object
      required: [company_name, email, password]
      properties:
        company_name:
          type: string
          maxLength: 100
          example: "AI-Tutor Inc"
        email:
          type: string
          format: email
          example: "cto@ai-tutor.com"
        password:
          type: string
          minLength: 12
          format: password
          example: "correct horse battery staple"

    SignupResponse:
      type: object
      required: [tenant, user, api_keys]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        user:
          $ref: '#/components/schemas/User'
        api_keys:
          type: object
          required: [test, live]
          properties:
            test:
              $ref: '#/components/schemas/MintedAPIKey'
            live:
              $ref: '#/components/schemas/MintedAPIKey'
        _notice:
          type: string
          description: |
            Reminder to persist the raw `key` values immediately.
            They cannot be retrieved later.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [session_token, expires_at, user, tenant_id]
      properties:
        session_token:
          type: string
          description: HS256-signed JWT. Pass as `Authorization Bearer`.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp at which the token expires.
        user:
          $ref: '#/components/schemas/User'
        tenant_id:
          type: string

    Tenant:
      type: object
      properties:
        id: { type: string, example: "tn_01J9K…" }
        name: { type: string }
        primary_email: { type: string }
        plan:
          type: string
          enum: [free, starter, growth, enterprise, custom]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [owner, admin, developer, finance, viewer]

    MintedAPIKey:
      type: object
      description: |
        The shape returned at creation only. List/get responses omit `key`
        and show only `prefix`.
      properties:
        id: { type: string, example: "ak_01J9K…" }
        key:
          type: string
          description: Raw secret — ONE-TIME.
          example: "sk_test_aB3dE7fGhJ2kL4mN5pQ8rS9tU0vW1xY2-_zA"
        prefix:
          type: string
          example: "sk_test_aB3dE7fGhJ2k"

    # ────────────────────────────────────────────────────────────────────
    # API key management (post-signup)
    # ────────────────────────────────────────────────────────────────────
    APIKey:
      type: object
      description: |
        Safe-to-return projection. Never contains the raw secret — only
        the prefix the user can use to recognize it in the dashboard.
      required: [id, name, environment, prefix]
      properties:
        id: { type: string, example: "ak_01J9K…" }
        name: { type: string, example: "production-backend" }
        environment:
          type: string
          enum: [test, live]
        prefix:
          type: string
          example: "sk_test_aB3dE7fGhJ2k"
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    CreateAPIKeyRequest:
      type: object
      required: [name, environment]
      properties:
        name:
          type: string
          example: "production-backend"
        environment:
          type: string
          enum: [test, live]

    CreateAPIKeyResponse:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Raw secret — ONE-TIME.
            _notice:
              type: string

    RevokeAPIKeyRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional audit-trail note; defaults to "manually revoked".

    ListAPIKeysResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/APIKey' }

    # ────────────────────────────────────────────────────────────────────
    # Tenant-level limits (policies + violations)
    # ────────────────────────────────────────────────────────────────────
    Tier:
      type: string
      enum: [conservative, standard, aggressive, custom]
      description: |
        Preset spending tiers. New tenants land at `conservative`
        (per-tx $5 / daily $20 / weekly $100 / monthly $300). Switch via
        PUT /v1/tenants/me/limits.

    Policy:
      type: object
      description: |
        A limit_policies row, safe-to-return projection.
      required: [id, scope_type, period_asset, timezone, enabled]
      properties:
        id: { type: string, example: "pol_01J9K…" }
        scope_type:
          type: string
          enum: [tenant_default, wallet_group, wallet, session_key]
        tier: { $ref: '#/components/schemas/Tier' }
        per_tx_amount:
          type: string
          description: Decimal USD; empty when unset.
          example: "5"
        daily_amount:   { type: string, example: "20" }
        weekly_amount:  { type: string, example: "100" }
        monthly_amount: { type: string, example: "300" }
        period_asset:   { type: string, example: "USDC" }
        timezone:       { type: string, example: "UTC" }
        enabled:        { type: boolean }
        created_at:     { type: string, format: date-time }

    UpdateTenantLimitsRequest:
      type: object
      description: |
        Specify EITHER `tier` OR all four explicit caps — never both. The
        server rejects partial cap updates so column state stays
        consistent.
      oneOf:
        - type: object
          required: [tier]
          properties:
            tier:
              type: string
              enum: [conservative, standard, aggressive]
        - type: object
          required: [per_tx_amount, daily_amount, weekly_amount, monthly_amount]
          properties:
            per_tx_amount:   { type: string, example: "100" }
            daily_amount:    { type: string, example: "500" }
            weekly_amount:   { type: string, example: "3000" }
            monthly_amount:  { type: string, example: "8000" }

    Violation:
      type: object
      required: [id, type]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - per_tx_exceeded
            - daily_exceeded
            - weekly_exceeded
            - monthly_exceeded
            - recipient_denied
            - recipient_not_allowlisted
            - policy_expired
            - session_key_expired
        policy_id:           { type: string }
        wallet_id:           { type: string }
        session_key_id:      { type: string }
        transaction_id:      { type: string }
        attempted_amount:    { type: string }
        attempted_asset:     { type: string }
        attempted_recipient: { type: string }
        created_at:          { type: string, format: date-time }

    ListViolationsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Violation' }

# ──────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check + registered rails
      security: []          # public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  rails:
                    type: array
                    items: { type: string }
                    example: [crossmint, tempo]

  /v1/rails:
    get:
      tags: [System]
      operationId: listRails
      summary: List registered payment rails
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rails:
                    type: array
                    items: { type: string }

  /signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Create a tenant, owner user, and default test+live keys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email + password for a session JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ──────────────────────────────────────────────────────────────────────
  # API key management
  # ──────────────────────────────────────────────────────────────────────

  /v1/api-keys:
    get:
      tags: [Auth]
      operationId: listAPIKeys
      summary: List the tenant's API keys (active + revoked)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListAPIKeysResponse' }
    post:
      tags: [Auth]
      operationId: createAPIKey
      summary: Mint a new API key
      description: |
        Returns the raw `key` string ONCE. Store it immediately — only the
        prefix is recoverable later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAPIKeyResponse' }
        '400':
          description: Invalid input
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot manage keys (owner/admin required)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/api-keys/{id}:
    delete:
      tags: [Auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: |
        Idempotent. Repeating the call on an already-revoked key returns
        the same row unchanged, preserving the original revoked_at
        timestamp.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeAPIKeyRequest' }
      responses:
        '200':
          description: Revoked (or already revoked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        '403':
          description: Role cannot revoke keys
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: Key not found in this tenant
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  # ──────────────────────────────────────────────────────────────────────
  # Tenant-level spending limits
  # ──────────────────────────────────────────────────────────────────────

  /v1/tenants/me/limits:
    get:
      tags: [Limits]
      operationId: getTenantLimits
      summary: Get the current tenant_default policy
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Policy' } }
        '404':
          description: No tenant_default policy has been set
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

    put:
      tags: [Limits]
      operationId: updateTenantLimits
      summary: Switch tier or set explicit caps
      description: |
        Supply EITHER `tier` (preset) OR all four explicit cap fields.
        Partial cap updates are rejected — the four columns move
        together. The server disables the prior active policy and
        inserts a fresh row, so `limit_violations.policy_id` keeps
        referencing the policy each violation actually breached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantLimitsRequest' }
      responses:
        '200':
          description: New tenant_default policy
          content:
            application/json: { schema: { $ref: '#/components/schemas/Policy' } }
        '400':
          description: Body shape invalid (e.g. both tier and caps supplied)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '403':
          description: Role cannot change tenant limits
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /v1/tenants/me/limits/violations:
    get:
      tags: [Limits]
      operationId: listLimitViolations
      summary: Paginated audit log of rejected transfers
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListViolationsResponse' }
